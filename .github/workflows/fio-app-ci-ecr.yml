name: ci-for-ECR

on:
  push:
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: 685467930734
  AWS_ROLE_NAME: github-ecr-push
  IMAGE_BASE_URL: 685467930734.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_NAMESPACE: lmp-demo

  FIO_FACTORY: lmp-demo
  DOCKER_IMAGES_DIR: docker

  COMPOSE_APP_DIR: compose/home-gateway
  COMPOSE_APP_NAME: home-gateway

  TUF_TARGET_TAG: ${{ github.ref_name }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_dir: [ha-plugin, ha-app]

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}
      image_uri_ha-plugin: ${{ steps.pinning.outputs.image_uri_ha-plugin }}
      image_uri_ha-app: ${{ steps.pinning.outputs.image_uri_ha-app }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Set short git commit SHA
        id: tag
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "short_sha=$calculatedSha" >> $GITHUB_OUTPUT
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
      -
        name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      -
        name: Build and push docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          outputs: type=registry,oci-mediatypes=true
          provenance: false
          platforms: linux/amd64,linux/arm64
          context: "{{ defaultContext }}:${{ env.DOCKER_IMAGES_DIR }}/${{ matrix.docker_dir }}"
          tags: |
            ${{ env.IMAGE_BASE_URL }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.docker_dir }}:${{ steps.tag.outputs.short_sha }}
            ${{ env.IMAGE_BASE_URL }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.docker_dir }}:latest
      -
        name: Save image URI
        id: pinning
        run: |
          uri=${{ env.IMAGE_BASE_URL }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.docker_dir }}@${{ steps.docker_build.outputs.digest }}
          echo "image_uri_${{matrix.docker_dir}}=$uri" >> $GITHUB_OUTPUT

  build-app:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    container:
      image: foundries/lmp-app-tools
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
      -
        name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      -
        name: Build and push Fio App
        id: app
        working-directory: ${{ env.COMPOSE_APP_DIR }}
        run: |
          export IMAGE_TAG=${{ needs.build-images.outputs.image_tag }}
          composectl publish -d app.hash ${{ env.IMAGE_BASE_URL }}/${{ env.IMAGE_NAMESPACE }}/${{ env.COMPOSE_APP_NAME }}:${{ needs.build-images.outputs.image_tag }} amd64,arm64
          uri="${{ env.IMAGE_BASE_URL }}/${{ env.IMAGE_NAMESPACE }}/${{ env.COMPOSE_APP_NAME }}@$(cat app.hash)"
          echo "app_uri=$uri" >> $GITHUB_OUTPUT
      -
        name: Compose and post Fio Targets
        run: fioctl targets add --type app --tags ${{ env.TUF_TARGET_TAG }} --src-tag ${{ env.TUF_TARGET_TAG }} ${{ steps.app.outputs.app_uri }} -t ${{ secrets.FIO_TOKEN }} -f ${{ env.FIO_FACTORY }}
